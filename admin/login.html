<!DOCTYPE html>
<html lang="pt-MZ">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login Administrativo | CONNECTION MOZAMBIQUE</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>
body{min-height:100vh;background:#102a43;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:white;width:100%;max-width:430px;padding:35px;border-radius:16px;box-shadow:0 15px 45px #0003}
.logo{max-height:65px;max-width:150px;object-fit:contain}
.btn-primary{background:#102a43;border-color:#102a43}
.btn-primary:hover{background:#183f60}
</style>
</head>
<body>
<div class="login-card">
<div class="text-center mb-4">
<img src="../public/logo.png" class="logo mb-3" alt="Connection Mozambique" onerror="this.style.display='none'">
<h4 class="fw-bold">Painel Administrativo</h4>
<p class="text-muted">CONNECTION MOZAMBIQUE, LDA</p>
</div>

<div id="alerta"></div>

<form id="loginForm">
<div class="mb-3">
<label class="form-label">Nome de utilizador ou e-mail</label>
<input id="username" class="form-control" required autocomplete="username">
</div>
<div class="mb-3">
<label class="form-label">Palavra-passe</label>
<input id="password" type="password" class="form-control" required autocomplete="current-password">
</div>
<button class="btn btn-primary w-100 py-2" type="submit">
<i class="bi bi-box-arrow-in-right"></i> Entrar
</button>
</form>

<hr>
<div class="text-center">
<button class="btn btn-link btn-sm text-decoration-none" id="showRecovery">
Esqueci a palavra-passe
</button>
</div>

<form id="recoveryForm" class="d-none mt-3">
<h6 class="fw-bold">Recuperar acesso administrativo</h6>
<p class="small text-muted">Introduza o nome de utilizador e o e-mail registado na conta.</p>
<div class="mb-2">
<input id="recoveryUser" class="form-control" placeholder="Nome de utilizador" required>
</div>
<div class="mb-2">
<input id="recoveryEmail" type="email" class="form-control" placeholder="E-mail da conta" required>
</div>
<div class="mb-2">
<input id="newPassword" type="password" class="form-control" placeholder="Nova palavra-passe (mínimo 8 caracteres)" minlength="8" required>
</div>
<button class="btn btn-primary w-100" type="submit">Redefinir palavra-passe</button>
<button class="btn btn-light w-100 mt-2" type="button" id="cancelRecovery">Cancelar</button>
</form>

<div class="text-center mt-4">
<a href="../index.html" class="small text-secondary text-decoration-none">
<i class="bi bi-arrow-left"></i> Voltar ao website
</a>
</div>
</div>

<script>
const CM_API_URL = window.CM_API_URL || 'http://localhost:3001';

function alertMessage(message, type = 'danger') {
  const alerta = document.getElementById('alerta');
  alerta.textContent = message;
  alerta.className = `alert alert-${type}`;
  alerta.classList.remove('d-none');
}

document.getElementById('loginForm').addEventListener('submit', async function(e) {
  e.preventDefault();

  const campoEmail = document.getElementById('username');
  const campoSenha = document.getElementById('password');
  const botao = this.querySelector('button[type="submit"], button:not([type])');

  const email = campoEmail.value.trim();
  const senha = campoSenha.value;

  if (!email || !senha) {
    alertMessage('Introduza o e-mail e a palavra-passe.');
    return;
  }

  if (botao) {
    botao.disabled = true;
    botao.textContent = 'A autenticar...';
  }

  try {
    const resposta = await fetch(
      `${CM_API_URL.replace(/\/+$/, '')}/api/admin/login`,
      {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          email: email,
          senha: senha
        })
      }
    );

    let dados = {};

    try {
      dados = await resposta.json();
    } catch (erro) {
      dados = {};
    }

    if (!resposta.ok || !dados.token) {
      throw new Error(
        dados.mensagem ||
        dados.erro ||
        'Credenciais inválidas ou acesso não autorizado.'
      );
    }

    sessionStorage.setItem('cm_admin_token', dados.token);
    sessionStorage.setItem('cm_admin_user', dados.administrador.email);
    sessionStorage.setItem('cm_admin_name', dados.administrador.nome);

    sessionStorage.removeItem('cm_admin_auth');

    window.location.href = 'dashboard.html';

  } catch (erro) {
    alertMessage(
      erro.message || 'Não foi possível iniciar sessão.'
    );

    if (botao) {
      botao.disabled = false;
      botao.textContent = 'Entrar';
    }
  }
});

document.getElementById('showRecovery').addEventListener('click', function(e) {
  e.preventDefault();

  alertMessage(
    'A recuperação automática ainda não está disponível. Contacte o responsável pelo sistema.',
    'info'
  );
});

const recoveryForm = document.getElementById('recoveryForm');

if (recoveryForm) {
  recoveryForm.addEventListener('submit', function(e) {
    e.preventDefault();

    alertMessage(
      'A recuperação automática ainda não está disponível. Contacte o responsável pelo sistema.',
      'info'
    );
  });
}

const cancelRecovery = document.getElementById('cancelRecovery');

if (cancelRecovery) {
  cancelRecovery.addEventListener('click', function(e) {
    e.preventDefault();

    recoveryForm.classList.add('d-none');
    document.getElementById('loginForm').classList.remove('d-none');
    document.getElementById('showRecovery').classList.remove('d-none');
  });
}
</script>
</body>
</html>
