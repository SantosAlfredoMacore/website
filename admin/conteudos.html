<!DOCTYPE html>
<html lang="pt-MZ">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conteúdos | Admin CM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root { --admin-sidebar: #102A43; }
    body { background: #f4f6f9; min-height: 100vh; }
    .admin-sidebar { background: var(--admin-sidebar); min-height: 100vh; color: #fff; width: 260px; position: fixed; left: 0; top: 0; z-index: 100; overflow-y: auto; }
    .admin-sidebar .nav-link { color: rgba(255,255,255,.8); border-radius: 8px; margin: 2px 12px; padding: .55rem 1rem; font-size: .92rem; }
    .admin-sidebar .nav-link:hover, .admin-sidebar .nav-link.active { background: rgba(255,255,255,.12); color: #fff; }
    .admin-sidebar .nav-link i { width: 22px; }
    .admin-main { margin-left: 260px; padding: 1.25rem 1.75rem; }
    .admin-topbar { background: #fff; border-radius: 12px; padding: .7rem 1.2rem; box-shadow: 0 2px 8px rgba(0,0,0,.06); margin-bottom: 1.25rem; }
    .table-card { background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.06); overflow: hidden; }
    .btn-icon { width: 32px; height: 32px; padding: 0; display: inline-flex; align-items: center; justify-content: center; border-radius: 6px; }
    .thumb { width: 48px; height: 36px; object-fit: cover; border-radius: 6px; border: 1px solid #ddd; }
    .nav-pills .nav-link { color: #495057; }
    .nav-pills .nav-link.active { background: #102A43; }
    @media (max-width: 991.98px) {
      .admin-sidebar { width: 100%; min-height: auto; position: relative; }
      .admin-main { margin-left: 0; }
    }
  
    .admin-nav .nav-group { margin: 4px 0; }
    .admin-nav .nav-group-toggle {
      width: calc(100% - 24px); margin: 2px 12px; text-align: left;
      background: transparent; border: 0; color: rgba(255,255,255,.85);
      display: flex; align-items: center; justify-content: space-between;
      border-radius: 8px; padding: .55rem 1rem; font-size: .92rem; cursor: pointer;
    }
    .admin-nav .nav-group-toggle:hover { background: rgba(255,255,255,.1); color: #fff; }
    .admin-nav .nav-group-toggle .chev { transition: transform .2s; font-size: .8rem; opacity: .7; }
    .admin-nav .nav-group-toggle[aria-expanded="false"] .chev { transform: rotate(-90deg); }
    .admin-nav .nav-group-items { padding-left: .5rem; }
    .admin-nav .nav-group-items.collapsed { display: none; }
    .admin-nav .nav-group-items .nav-link { font-size: .88rem; padding: .45rem 1rem .45rem 1.4rem; }

  </style>
</head>
<body>
  <div class="d-flex flex-column flex-lg-row">
    <aside class="admin-sidebar py-3">

      <div class="px-3 mb-3 d-flex align-items-center gap-2">
        <img src="../public/logo.png" alt="Logo" height="34" onerror="this.style.display='none'">
        <span class="fw-bold">Admin CM</span>
      </div>
      <nav class="nav flex-column admin-nav">
        <a class="nav-link" href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>

        <div class="nav-group">
          <button class="nav-link nav-group-toggle" type="button" data-group="conteudo" aria-expanded="true">
            <span><i class="bi bi-collection"></i> Conteúdo</span>
            <i class="bi bi-chevron-down chev"></i>
          </button>
          <div class="nav-group-items" data-group-panel="conteudo">
            <a class="nav-link active" href="conteudos.html"><i class="bi bi-folder2-open"></i> Gestão de conteúdos</a>
            <a class="nav-link" href="servicos.html"><i class="bi bi-gear"></i> Serviços</a>
            <a class="nav-link" href="slider.html"><i class="bi bi-images"></i> Slider / Hero</a>
            <a class="nav-link" href="imagens.html"><i class="bi bi-image"></i> Imagens</a>
            <a class="nav-link" href="textos.html"><i class="bi bi-fonts"></i> Textos</a>
          </div>
        </div>

        <div class="nav-group">
          <button class="nav-link nav-group-toggle" type="button" data-group="operacao" aria-expanded="true">
            <span><i class="bi bi-activity"></i> Operação</span>
            <i class="bi bi-chevron-down chev"></i>
          </button>
          <div class="nav-group-items" data-group-panel="operacao">
            <a class="nav-link" href="orcamentos.html"><i class="bi bi-file-earmark-text"></i> Orçamentos</a>
            <a class="nav-link" href="atividade.html"><i class="bi bi-graph-up"></i> Atividade / Visitas</a>
            <a class="nav-link" href="utilizadores.html"><i class="bi bi-people"></i> Utilizadores</a>
          </div>
        </div>

        <hr class="border-secondary mx-3 my-2">
        <a class="nav-link" href="../index.html" target="_blank"><i class="bi bi-box-arrow-up-right"></i> Ver Site</a>
        <a class="nav-link" href="#" id="btnLogout"><i class="bi bi-box-arrow-left"></i> Sair</a>
      </nav>

    </aside>

    <main class="admin-main flex-grow-1">
      <div class="admin-topbar d-flex justify-content-between align-items-center flex-wrap gap-2">
        <div>
          <h1 class="h5 mb-0">Gestão de Conteúdos</h1>
          <small class="text-muted">Editar, visualizar e eliminar itens do site</small>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-outline-secondary btn-sm" id="btnExport"><i class="bi bi-download"></i> Exportar</button>
          <button class="btn btn-primary btn-sm" id="btnSave"><i class="bi bi-save"></i> Guardar</button>
        </div>
      </div>

      <div id="alertBox"></div>

      <ul class="nav nav-pills gap-1 mb-3 flex-wrap" id="tabs">
        <li class="nav-item"><a class="nav-link active" data-tab="servicos" href="#">Serviços</a></li>
        <li class="nav-item"><a class="nav-link" data-tab="solucoes" href="#">Soluções</a></li>
        <li class="nav-item"><a class="nav-link" data-tab="empresas" href="#">Empresas</a></li>
        <li class="nav-item"><a class="nav-link" data-tab="sobre" href="#">Sobre Nós</a></li>
        <li class="nav-item"><a class="nav-link" data-tab="recursos" href="#">Recursos</a></li>
      </ul>

      <div class="table-card">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light" id="thead"></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
        <div class="p-3 border-top d-flex justify-content-between align-items-center">
          <button class="btn btn-success btn-sm" id="btnAdd"><i class="bi bi-plus-lg"></i> Adicionar</button>
          <a href="#" id="linkPublic" class="small" target="_blank">Ver no site →</a>
        </div>
      </div>

      <!-- Painel Sobre (form em vez de tabela) -->
      <div id="sobreForm" class="table-card p-4" style="display:none">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Título</label>
            <input type="text" class="form-control" id="sobreTitulo">
          </div>
          <div class="col-12">
            <label class="form-label">Texto principal</label>
            <textarea class="form-control" id="sobreTexto" rows="3"></textarea>
          </div>
          <div class="col-md-6">
            <label class="form-label">Missão</label>
            <textarea class="form-control" id="sobreMissao" rows="2"></textarea>
          </div>
          <div class="col-md-6">
            <label class="form-label">Visão</label>
            <textarea class="form-control" id="sobreVisao" rows="2"></textarea>
          </div>
          <div class="col-12">
            <label class="form-label">Valores (um por linha)</label>
            <textarea class="form-control" id="sobreValores" rows="3"></textarea>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal Ver / Editar -->
  <div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalTitle">Editar</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
          <button type="button" class="btn btn-primary" id="modalSave" style="display:none">Guardar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/admin-common.js"></script>
  <script>
    let content = null;
    let currentTab = 'servicos';
    let editIndex = null;
    let editModal = null;
    let viewOnly = false;

    const publicLinks = {
      servicos: '../servicos.html',
      solucoes: '../solucoes.html',
      empresas: '../index.html',
      sobre: '../sobre.html',
      recursos: '../recursos.html'
    };

    document.addEventListener('DOMContentLoaded', () => {
      if (!requireAuth()) return;
      document.getElementById('btnLogout').addEventListener('click', logout);
      content = loadContent();
      editModal = new bootstrap.Modal(document.getElementById('editModal'));

      const params = new URLSearchParams(location.search);
      if (params.get('tab')) currentTab = params.get('tab');

      document.querySelectorAll('#tabs .nav-link').forEach(a => {
        a.addEventListener('click', e => {
          e.preventDefault();
          currentTab = a.dataset.tab;
          document.querySelectorAll('#tabs .nav-link').forEach(x => x.classList.remove('active'));
          a.classList.add('active');
          render();
        });
        if (a.dataset.tab === currentTab) {
          document.querySelectorAll('#tabs .nav-link').forEach(x => x.classList.remove('active'));
          a.classList.add('active');
        }
      });

      document.getElementById('btnSave').addEventListener('click', () => {
        if (currentTab === 'sobre') collectSobre();
        saveContent(content);
        showAlert('Conteúdo guardado com sucesso!');
        logActivity(sessionStorage.getItem('cm_admin_user') || 'admin', 'edit', 'Guardou conteúdos: ' + currentTab);
      });
      document.getElementById('btnExport').addEventListener('click', exportContent);
      document.getElementById('btnAdd').addEventListener('click', () => openEdit(-1, false));
      document.getElementById('modalSave').addEventListener('click', applyEdit);

      render();
    });

    function showAlert(msg, type) {
      document.getElementById('alertBox').innerHTML = `<div class="alert alert-${type||'success'} alert-dismissible fade show py-2">${msg}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>`;
    }

    function collectSobre() {
      content.sobre.titulo = document.getElementById('sobreTitulo').value.trim();
      content.sobre.texto = document.getElementById('sobreTexto').value.trim();
      content.sobre.missao = document.getElementById('sobreMissao').value.trim();
      content.sobre.visao = document.getElementById('sobreVisao').value.trim();
      content.sobre.valores = document.getElementById('sobreValores').value.split('\n').map(s => s.trim()).filter(Boolean);
    }

    function render() {
      document.getElementById('linkPublic').href = publicLinks[currentTab] || '../index.html';
      const isSobre = currentTab === 'sobre';
      document.querySelector('.table-card').style.display = isSobre ? 'none' : 'block';
      document.getElementById('sobreForm').style.display = isSobre ? 'block' : 'none';
      document.getElementById('btnAdd').style.display = isSobre ? 'none' : 'inline-block';

      if (isSobre) {
        document.getElementById('sobreTitulo').value = content.sobre.titulo || '';
        document.getElementById('sobreTexto').value = content.sobre.texto || '';
        document.getElementById('sobreMissao').value = content.sobre.missao || '';
        document.getElementById('sobreVisao').value = content.sobre.visao || '';
        document.getElementById('sobreValores').value = (content.sobre.valores || []).join('\n');
        return;
      }

      const list = content[currentTab] || [];
      const thead = document.getElementById('thead');
      const tbody = document.getElementById('tbody');

      if (currentTab === 'servicos') {
        thead.innerHTML = '<tr><th>Img</th><th>Título</th><th>Badge</th><th>Estado</th><th class="text-end">Ações</th></tr>';
        tbody.innerHTML = list.map((s, i) => rowHtml(i, s.imagem, s.titulo, s.badge, s.ativo)).join('') || emptyRow();
      } else if (currentTab === 'solucoes') {
        thead.innerHTML = '<tr><th>Img</th><th>Título</th><th>Descrição</th><th>Estado</th><th class="text-end">Ações</th></tr>';
        tbody.innerHTML = list.map((s, i) => rowHtml(i, s.imagem, s.titulo, (s.descricao||'').slice(0,40), s.ativo)).join('') || emptyRow();
      } else if (currentTab === 'empresas') {
        thead.innerHTML = '<tr><th>Logo</th><th>Nome</th><th>Estado</th><th class="text-end">Ações</th></tr>';
        tbody.innerHTML = list.map((s, i) => `
          <tr>
            <td><img src="${imgPath(s.logo)}" class="thumb" onerror="this.src='../public/logo.png'"></td>
            <td>${esc(s.nome)}</td>
            <td>${s.ativo !== false ? '<span class="badge bg-success">Ativo</span>' : '<span class="badge bg-secondary">Inativo</span>'}</td>
            <td class="text-end text-nowrap">${actionBtns(i)}</td>
          </tr>`).join('') || emptyRow();
      } else if (currentTab === 'recursos') {
        thead.innerHTML = '<tr><th>Img</th><th>Título</th><th>Tipo</th><th>Estado</th><th class="text-end">Ações</th></tr>';
        tbody.innerHTML = list.map((s, i) => rowHtml(i, s.imagem, s.titulo, s.tipo, s.ativo)).join('') || emptyRow();
      }

      bindActions();
    }

    function rowHtml(i, img, title, sub, ativo) {
      return `<tr>
        <td><img src="${imgPath(img)}" class="thumb" onerror="this.src='../public/logo.png'"></td>
        <td>${esc(title)}</td>
        <td class="small text-muted">${esc(sub)}</td>
        <td>${ativo !== false ? '<span class="badge bg-success">Ativo</span>' : '<span class="badge bg-secondary">Inativo</span>'}</td>
        <td class="text-end text-nowrap">${actionBtns(i)}</td>
      </tr>`;
    }

    function actionBtns(i) {
      return `
        <button class="btn btn-outline-secondary btn-icon btn-view" data-i="${i}" title="Visualizar"><i class="bi bi-eye"></i></button>
        <button class="btn btn-outline-primary btn-icon btn-edit" data-i="${i}" title="Editar"><i class="bi bi-pencil"></i></button>
        <button class="btn btn-outline-danger btn-icon btn-del" data-i="${i}" title="Eliminar"><i class="bi bi-trash"></i></button>`;
    }

    function emptyRow() {
      return '<tr><td colspan="5" class="text-center text-muted py-4">Nenhum item. Clique em Adicionar.</td></tr>';
    }

    function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    function bindActions() {
      document.querySelectorAll('.btn-view').forEach(b => b.addEventListener('click', () => openEdit(+b.dataset.i, true)));
      document.querySelectorAll('.btn-edit').forEach(b => b.addEventListener('click', () => openEdit(+b.dataset.i, false)));
      document.querySelectorAll('.btn-del').forEach(b => b.addEventListener('click', () => {
        const i = +b.dataset.i;
        if (!confirm('Eliminar este item?')) return;
        content[currentTab].splice(i, 1);
        logActivity(sessionStorage.getItem('cm_admin_user')||'admin', 'delete', 'Eliminou item em ' + currentTab);
        render();
      }));
    }

    function openEdit(index, view) {
      viewOnly = view;
      editIndex = index;
      const isNew = index < 0;
      document.getElementById('modalTitle').textContent = view ? 'Visualizar' : (isNew ? 'Adicionar' : 'Editar');
      document.getElementById('modalSave').style.display = view ? 'none' : 'inline-block';

      let item = {};
      if (!isNew) item = { ...(content[currentTab][index] || {}) };
      else {
        if (currentTab === 'servicos') item = { id: 's' + Date.now(), titulo: '', descricaoCurta: '', imagem: './public/logo.png', badge: '', tituloLongo: '', descricaoLonga: '', itens: [], ativo: true };
        if (currentTab === 'solucoes') item = { id: 'sol' + Date.now(), titulo: '', descricao: '', imagem: './public/logo.png', ativo: true };
        if (currentTab === 'empresas') item = { id: 'e' + Date.now(), nome: '', logo: './public/logo.png', ativo: true };
        if (currentTab === 'recursos') item = { id: 'r' + Date.now(), titulo: '', tipo: 'Artigo', link: '#', imagem: './public/logo.png', ativo: true };
      }

      const ro = view ? 'readonly' : '';
      const dis = view ? 'disabled' : '';
      let html = '';

      if (currentTab === 'servicos') {
        html = `
          <div class="row g-2">
            <div class="col-md-6"><label class="form-label">Título</label><input class="form-control" id="f_titulo" value="${esc(item.titulo)}" ${ro}></div>
            <div class="col-md-6"><label class="form-label">Badge</label><input class="form-control" id="f_badge" value="${esc(item.badge)}" ${ro}></div>
            <div class="col-12"><label class="form-label">Imagem (caminho)</label><input class="form-control" id="f_imagem" value="${esc(item.imagem)}" ${ro}></div>
            <div class="col-12"><label class="form-label">Descrição curta</label><textarea class="form-control" id="f_descCurta" rows="2" ${ro}>${esc(item.descricaoCurta)}</textarea></div>
            <div class="col-12"><label class="form-label">Título longo</label><input class="form-control" id="f_tituloLongo" value="${esc(item.tituloLongo)}" ${ro}></div>
            <div class="col-12"><label class="form-label">Descrição longa</label><textarea class="form-control" id="f_descLonga" rows="2" ${ro}>${esc(item.descricaoLonga)}</textarea></div>
            <div class="col-12"><label class="form-label">Itens (um por linha)</label><textarea class="form-control" id="f_itens" rows="4" ${ro}>${(item.itens||[]).join('\n')}</textarea></div>
            <div class="col-12"><div class="form-check"><input class="form-check-input" type="checkbox" id="f_ativo" ${item.ativo!==false?'checked':''} ${dis}><label class="form-check-label" for="f_ativo">Ativo</label></div></div>
          </div>`;
      } else if (currentTab === 'solucoes') {
        html = `
          <div class="row g-2">
            <div class="col-12"><label class="form-label">Título</label><input class="form-control" id="f_titulo" value="${esc(item.titulo)}" ${ro}></div>
            <div class="col-12"><label class="form-label">Descrição</label><textarea class="form-control" id="f_descricao" rows="3" ${ro}>${esc(item.descricao)}</textarea></div>
            <div class="col-12"><label class="form-label">Imagem</label><input class="form-control" id="f_imagem" value="${esc(item.imagem)}" ${ro}></div>
            <div class="col-12"><div class="form-check"><input class="form-check-input" type="checkbox" id="f_ativo" ${item.ativo!==false?'checked':''} ${dis}><label class="form-check-label" for="f_ativo">Ativo</label></div></div>
          </div>`;
      } else if (currentTab === 'empresas') {
        html = `
          <div class="row g-2">
            <div class="col-12"><label class="form-label">Nome</label><input class="form-control" id="f_nome" value="${esc(item.nome)}" ${ro}></div>
            <div class="col-12"><label class="form-label">Logo (caminho)</label><input class="form-control" id="f_logo" value="${esc(item.logo)}" ${ro}></div>
            <div class="col-12"><div class="form-check"><input class="form-check-input" type="checkbox" id="f_ativo" ${item.ativo!==false?'checked':''} ${dis}><label class="form-check-label" for="f_ativo">Ativo</label></div></div>
          </div>`;
      } else if (currentTab === 'recursos') {
        html = `
          <div class="row g-2">
            <div class="col-md-8"><label class="form-label">Título</label><input class="form-control" id="f_titulo" value="${esc(item.titulo)}" ${ro}></div>
            <div class="col-md-4"><label class="form-label">Tipo</label><input class="form-control" id="f_tipo" value="${esc(item.tipo)}" ${ro}></div>
            <div class="col-12"><label class="form-label">Link</label><input class="form-control" id="f_link" value="${esc(item.link)}" ${ro}></div>
            <div class="col-12"><label class="form-label">Imagem</label><input class="form-control" id="f_imagem" value="${esc(item.imagem)}" ${ro}></div>
            <div class="col-12"><div class="form-check"><input class="form-check-input" type="checkbox" id="f_ativo" ${item.ativo!==false?'checked':''} ${dis}><label class="form-check-label" for="f_ativo">Ativo</label></div></div>
          </div>`;
      }

      document.getElementById('modalBody').innerHTML = html;
      editModal.show();
    }

    function applyEdit() {
      let item = {};
      if (currentTab === 'servicos') {
        item = {
          id: editIndex >= 0 ? content.servicos[editIndex].id : 's' + Date.now(),
          titulo: val('f_titulo'), badge: val('f_badge'), imagem: val('f_imagem'),
          descricaoCurta: val('f_descCurta'), tituloLongo: val('f_tituloLongo'), descricaoLonga: val('f_descLonga'),
          itens: (document.getElementById('f_itens').value || '').split('\n').map(s => s.trim()).filter(Boolean),
          ativo: document.getElementById('f_ativo').checked
        };
      } else if (currentTab === 'solucoes') {
        item = {
          id: editIndex >= 0 ? content.solucoes[editIndex].id : 'sol' + Date.now(),
          titulo: val('f_titulo'), descricao: val('f_descricao'), imagem: val('f_imagem'),
          ativo: document.getElementById('f_ativo').checked
        };
      } else if (currentTab === 'empresas') {
        item = {
          id: editIndex >= 0 ? content.empresas[editIndex].id : 'e' + Date.now(),
          nome: val('f_nome'), logo: val('f_logo'),
          ativo: document.getElementById('f_ativo').checked
        };
      } else if (currentTab === 'recursos') {
        item = {
          id: editIndex >= 0 ? content.recursos[editIndex].id : 'r' + Date.now(),
          titulo: val('f_titulo'), tipo: val('f_tipo'), link: val('f_link'), imagem: val('f_imagem'),
          ativo: document.getElementById('f_ativo').checked
        };
      }

      if (editIndex < 0) content[currentTab].push(item);
      else content[currentTab][editIndex] = item;

      logActivity(sessionStorage.getItem('cm_admin_user')||'admin', 'edit', (editIndex < 0 ? 'Adicionou' : 'Editou') + ' item em ' + currentTab);
      editModal.hide();
      render();
      showAlert('Item atualizado. Clique em Guardar para persistir.');
    }

    function val(id) { return (document.getElementById(id)?.value || '').trim(); }
  </script>
<script>

    document.querySelectorAll('.nav-group-toggle').forEach(function(btn){
      btn.addEventListener('click', function(){
        var open = btn.getAttribute('aria-expanded') === 'true';
        btn.setAttribute('aria-expanded', open ? 'false' : 'true');
        var panel = document.querySelector('[data-group-panel="'+btn.getAttribute('data-group')+'"]');
        if (panel) panel.classList.toggle('collapsed', open);
      });
    });

</script>
</body>
</html>
